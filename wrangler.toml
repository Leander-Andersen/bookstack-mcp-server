name = "bookstack-mcp-server"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat_v2"]
account_id = "fa8dc1730bfd7b376de59d07758e28b5"

[vars]
# SERVER_NAME and SERVER_VERSION are sourced from package.json at build
# time (imported in src/config/worker-config.ts). The env-var overrides
# below still work if you want to set them explicitly, but you don't need
# to — bumping package.json's version field updates the worker, the
# server-info tool, and the X-MCP-Server-Version response header all at
# once. Leave commented out for the default behaviour.
# SERVER_NAME = "bookstack-mcp-server"
# SERVER_VERSION = "1.4.0"

# Diagnostic OAuth event log — off by default. Set to "true" in the
# Cloudflare dashboard (Workers → Variables) when you need to debug an
# auth/MCP failure, then back to "false" or remove. Toggle is read at
# runtime so no redeploy needed.
DIAGNOSTIC_LOG_ENABLED = "false"

# Secrets — set via `wrangler secret put` or the CF dashboard:
#   npx wrangler secret put BOOKSTACK_BASE_URL
#   npx wrangler secret put BOOKSTACK_API_TOKEN
#   npx wrangler secret put MCP_API_KEY

# Primary KV namespace:
#   - OAuth single-use auth-code enforcement (key prefix: code-used:)
#   - Future: BookStack response caching (key prefix: cache:)
[[kv_namespaces]]
binding = "BOOKSTACK_KV"
id = "45f216ea7e734af9ab77a324997457a5"

# Diagnostic KV — short-lived debug events (1h TTL).
# Inspect via:  GET /debug/oauth-log?key=<MCP_API_KEY>
[[kv_namespaces]]
binding = "BOOKSTACK_DIAGNOSTIC_KV"
id = "e3abb3b95b4c4e7097fb85544d5a3afd"

# MCP audit log — every tool call and auth event, in the unified-logging-and-
# visualisation (ULV) D1 database. ULV is shared by all MCP servers' audit
# logs (one D1 for everything, to stay within Workers Free). This server only
# ever touches its own tables:
#
#   <AUDIT_INSTANCE_ID>_tool_calls, <AUDIT_INSTANCE_ID>_auth_events,
#   <AUDIT_INSTANCE_ID>_schema_migrations   + its own row in audit_instances
#
# audit_instances is the shared registry ULV reads to discover this server,
# then imports its tables for display. ULV also owns retention: it prunes
# imported rows older than 30 days, so this server does not need its own
# cron or sweep. No schema step — tables are created on first write
# (src/audit/migrate.ts). Remove this block to run without an audit log;
# /health reports audit_configured either way.
#
# Optional vars:
#   AUDIT_INSTANCE_ID="bookstack"  table prefix; give each deployment its own
#   AUDIT_DISPLAY_NAME="BookStack" name shown in the viewer
#   AUDIT_ENABLED="false"          stop writing entirely
#   AUDIT_LOG_READS="false"        only record create/update/delete/restore
#   AUDIT_MAX_FIELD_CHARS="8000"   per-field cap on stored args/results
[[d1_databases]]
binding = "AUDIT_DB"
database_name = "unified-logs"
database_id = "d7f80f72-041f-4379-8300-c0cad0a2192a"
